spring.application.name=Lumiere

# ===== Database (Neon) =====
# All secrets come from environment variables (set locally in IntelliJ,
# and on the server in Render). Nothing sensitive is written in this file.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# ===== Admin =====
lumiere.admin.password-hash=${ADMIN_PASSWORD_HASH}

# ===== JWT =====
lumiere.jwt.secret=${JWT_SECRET}
lumiere.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===== Cloudinary =====
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# ===== CORS (frontend origin) =====
# Local = http://localhost:3000. On the server, set FRONTEND_ORIGIN to your Vercel URL.
lumiere.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:3000}

server.port=${PORT:8080}